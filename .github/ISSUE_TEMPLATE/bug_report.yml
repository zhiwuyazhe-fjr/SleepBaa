name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] <模块> - <简短描述>"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请优先写清楚复现路径、实际结果和环境。不要提交 access token、验证码、手机号等敏感信息。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 这个问题是什么，影响了哪个用户流程？
      placeholder: 例如：首页点击开始睡眠后没有进入睡眠中页。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请按顺序列出稳定复现方式。
      placeholder: |
        1. 打开 App，进入 /home/pre_sleep
        2. 点击开始睡眠
        3. 观察页面跳转和控制台日志
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 正常情况下应该发生什么？
      placeholder: 点击后应进入 /home/post_sleep，并创建 active sleep session。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: 页面没有跳转，或返回了错误提示。
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - 致命：崩溃、数据丢失、无法启动
        - 严重：核心流程不可用
        - 一般：部分功能受影响，有 workaround
        - 轻微：UI、文案或轻微体验问题
    validations:
      required: true

  - type: dropdown
    id: modules
    attributes:
      label: 相关模块
      multiple: true
      options:
        - home
        - sleep
        - dream
        - assistant
        - dorm
        - feedback
        - profile
        - notifications
        - auth
        - analysis
        - intervention
        - logs
        - night_mood
        - sleep_encyclopedia
        - core
        - functions
        - docs
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: 相关路由
      description: 如果是页面问题，请填写路由。
      placeholder: /home/pre_sleep
    validations:
      required: false

  - type: input
    id: files
    attributes:
      label: 相关文件
      description: 如果已定位，请填写页面、组件或后端文件路径。
      placeholder: lib/features/home/presentation/pages/home_pre_sleep_page.dart
    validations:
      required: false

  - type: input
    id: api
    attributes:
      label: 相关接口
      description: 如果涉及后端，请填写接口。
      placeholder: POST /api/sleep/enter
    validations:
      required: false

  - type: dropdown
    id: backend_mode
    attributes:
      label: 后端模式
      options:
        - in_memory
        - emulator
        - staging
        - production
        - 不确定
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请填写设备、系统、App 版本或 commit、Flutter 版本。
      placeholder: |
        - 设备：
        - 系统版本：
        - App 版本或 commit：
        - Flutter 版本：
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图说明
      description: 可以粘贴关键日志，截图请直接拖入 issue。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 issue，确认不是重复问题。
          required: true
        - label: 我已尽量给出可复现步骤。
          required: true
