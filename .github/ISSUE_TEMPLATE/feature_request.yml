name: ✨ 功能请求
description: 提出一个新的功能或改进建议
title: "[Feature] <模块> - <简短描述>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！请填写以下信息帮助我们理解你的需求。

  - type: input
    id: title
    attributes:
      label: 标题
      description: 格式：[Feature] 模块名 - 简短描述
      placeholder: "[Feature] 模块：睡眠 - 添加睡眠数据导出功能"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 💡 相关痛点
      description: 这个功能解决了什么问题？
      placeholder: "例如：目前无法导出睡眠数据，想要分享给医生或自己分析时很不方便"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: ✅ 期望的解决方案
      description: 你希望这个功能是什么样的？
      placeholder: "希望在睡眠记录页面添加一个导出按钮，支持导出为 Excel 或 PDF 格式"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 其他替代方案
      description: 是否有其他可接受的实现方式？（可选）
      placeholder: "如果无法导出文件，至少支持复制文本格式的数据"
    validations:
      required: false

  - type: checkboxes
    id: modules
    attributes:
      label: 🏷️ 模块标签
      description: 请选择功能涉及的模块（可多选）
      options:
        - label: "模块：睡眠"
        - label: "模块：梦境"
        - label: "模块：分析"
        - label: "模块：助手"
        - label: "模块：宿舍"
        - label: "模块：反馈"
        - label: "模块：首页"
        - label: "模块：干预"
        - label: "模块：日志"
        - label: "模块：情绪"
        - label: "模块：通知"
        - label: "模块：我的"
        - label: "模块：UI"
        - label: "模块：网络"
        - label: "模块：核心"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 🔍 优先级
      description: 你希望这个功能的优先级是？
      options:
        - "高 - 急需，影响核心体验"
        - "中 - 重要，但可以等待"
        - "低 - 有了更好，没有也行"
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: 📎 补充信息
      description: 如有设计稿、参考图、或其他说明（可选）
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **提交前检查**：
        - [ ] 我已搜索现有 issue，确认没有重复的功能请求
        - [ ] 我已清晰描述问题和期望方案
        - [ ] 我已选择相关模块标签
